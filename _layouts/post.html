---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-kicker">{{ page.category }}</p>
    <h1>{{ page.title }}</h1>
    <p class="post-description">{{ page.description }}</p>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time>
      {% if page.reading_time %}<span>{{ page.reading_time }}</span>{% endif %}
    </div>
    {% if page.tags %}
      <ul class="tag-list" aria-label="文章标签">
        {% for tag in page.tags %}
          <li>{{ tag }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/archive/' | relative_url }}">查看全部文章</a>
  </footer>
</article>
